name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      vsix_produced: ${{ steps.detect-vsix.outputs.produced }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect release VSIX
        id: detect-vsix
        shell: bash
        run: |
          if compgen -G "nan-builders-vscode-*.vsix" > /dev/null; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload VSIX for Marketplace publishing
        if: steps.detect-vsix.outputs.produced == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marketplace-vsix
          path: nan-builders-vscode-*.vsix
          if-no-files-found: error
          retention-days: 7

  publish-marketplace:
    if: ${{ needs.release.outputs.vsix_produced == 'true' && vars.MARKETPLACE_PUBLISH_ENABLED == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: marketplace
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: marketplace-vsix
          path: marketplace-vsix
      - name: Publish to the VS Code Marketplace
        run: |
          shopt -s nullglob
          vsix=(marketplace-vsix/nan-builders-vscode-*.vsix)
          if [ ${#vsix[@]} -ne 1 ]; then
            echo "::error::Expected exactly one VSIX artifact, found ${#vsix[@]}."
            exit 1
          fi
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The VSCE_PAT secret is not configured. The GitHub Release already contains the VSIX for recovery, but Marketplace publishing failed."
            exit 1
          fi
          npx vsce verify-pat svg153
          npx vsce publish --packagePath "${vsix[0]}" --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
