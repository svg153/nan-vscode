name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rolling preview channel: every merge to main publishes an installable
  # prerelease VSIX to the fixed `preview` GitHub release. Validate it with
  # "Install from VSIX"; promotion to the Marketplace stays manual
  # (see publish-stable.yml).
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Stamp preview version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            pkg.version = `${pkg.version}-preview.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(pkg.version);
          ' > preview-version.txt
          cat preview-version.txt
      - name: Package preview VSIX
        # Fixed asset name so --clobber replaces the previous preview build
        # instead of accumulating stale VSIXes on the rolling release.
        run: npx vsce package --no-dependencies --pre-release --out nan-builders-vscode-preview.vsix
      - name: Attach to rolling preview release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          vsix=(nan-builders-vscode-*.vsix)
          if [ ${#vsix[@]} -ne 1 ]; then
            echo "::error::Expected exactly one preview VSIX, found ${#vsix[@]}."
            exit 1
          fi
          if ! gh release view preview --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create preview \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Preview builds" \
              --notes "Rolling preview VSIX from the latest merge to main. Not published to the Marketplace; install via 'Extensions: Install from VSIX' to validate before promotion." \
              "${vsix[0]}"
          else
            gh release upload preview --repo "$GITHUB_REPOSITORY" --clobber "${vsix[0]}"
          fi
