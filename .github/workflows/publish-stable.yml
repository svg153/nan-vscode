name: Publish stable to Marketplace

# Promotion gate: run this once you have validated the pre-release. The
# `marketplace` environment can require reviewers, so approving the deployment
# is the "the pre-release works" signal — the same VSIX that main built is then
# published as the stable version.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish (e.g. v1.12.0). Leave empty to use the latest stable release.
        required: false
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Resolve the release to promote
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" \
              --exclude-pre-releases --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be a stable semver release like v1.12.0 (no prerelease suffix)."
            exit 1
          fi
          # gh exits non-zero (stopping the step) if the release cannot be read,
          # so a lookup failure can never silently promote.
          is_prerelease=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
          if [ "$is_prerelease" != "false" ]; then
            echo "::error::Release $tag is marked prerelease; only stable releases can be promoted."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Promoting $tag"
      - name: Download the release VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-vsix
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'nan-builders-vscode-*.vsix' --dir release-vsix
          count=$(ls release-vsix/*.vsix | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX on release $TAG, found $count."
            exit 1
          fi
          # Guard against promoting an artifact built from a different version.
          expected="release-vsix/nan-builders-vscode-$VERSION.vsix"
          if [ ! -f "$expected" ]; then
            echo "::error::Release $TAG does not contain $expected."
            exit 1
          fi
      - name: Publish to the VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TRUSTED_PUBLISHING: ${{ vars.MARKETPLACE_TRUSTED_PUBLISHING }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          args=(--packagePath "release-vsix/nan-builders-vscode-$VERSION.vsix" --no-dependencies --skip-duplicate)
          if [ "$TRUSTED_PUBLISHING" = "true" ]; then
            npx vsce publish "${args[@]}" --oidc
          else
            if [ -z "$VSCE_PAT" ]; then
              echo "::error::Neither trusted publishing (MARKETPLACE_TRUSTED_PUBLISHING=true) nor the VSCE_PAT secret is configured, so publishing cannot proceed."
              exit 1
            fi
            npx vsce verify-pat svg153
            npx vsce publish "${args[@]}"
          fi
