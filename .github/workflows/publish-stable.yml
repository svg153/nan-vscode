name: Publish stable to Marketplace

# Manual promotion gate: run this after you have validated a release
# (typically the matching preview VSIX). The `marketplace` environment can be
# configured with required reviewers so publishing also needs an explicit
# approval in the Actions UI.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish (e.g. v1.6.0)
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Download release VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be a stable semver release like v1.6.0 (no prerelease suffix)."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json prerelease -q .prerelease | grep -q true; then
            echo "::error::Release $tag is marked prerelease; only stable releases can be promoted."
            exit 1
          fi
          mkdir -p release-vsix
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'nan-builders-vscode-*.vsix' --dir release-vsix
          count=$(ls release-vsix/*.vsix | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX on release $tag, found $count."
            exit 1
          fi
      - name: Publish to the VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          shopt -s nullglob
          vsix=(release-vsix/nan-builders-vscode-*.vsix)
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The VSCE_PAT secret is not configured, so publishing cannot proceed."
            exit 1
          fi
          npx vsce verify-pat svg153
          npx vsce publish --packagePath "${vsix[0]}" --no-dependencies
