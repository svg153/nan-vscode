name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Cache VS Code Insiders test install
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-insiders-${{ runner.os }}-${{ hashFiles('scripts/run-insiders-integration.cjs', 'package-lock.json') }}
      - run: npm ci
      - name: Audit dependencies (advisories are non-blocking)
        run: npm run audit:dependencies
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: |
            dependency-audit/audit.json
            dependency-audit/summary.md
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: nan-builders-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
