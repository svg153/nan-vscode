name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - name: Cache VS Code Insiders test install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vscode-test
          key: vscode-test-insiders-${{ runner.os }}-${{ hashFiles('scripts/run-insiders-integration.cjs', 'package-lock.json') }}
      - run: npm ci
      - name: Audit dependencies (advisories are non-blocking)
        run: npm run audit:dependencies
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependency-audit
          path: |
            dependency-audit/audit.json
            dependency-audit/summary.md
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nan-builders-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
